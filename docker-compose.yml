# Phase-1 stack: app + minio ONLY — no postgres/redis (spec D13).
# Buckets are bootstrapped by the app itself (ensureBuckets at startup),
# so no mc/init container is needed.
services:
  app:
    build: .
    ports:
      - "${PORT:-8788}:${PORT:-8788}"
    # .env drives everything; only the endpoint is overridden for the
    # compose network (MinIO is a sibling container, not the host's :9002)
    env_file: .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - app-data:/app/data # sqlite tracker + finalize tmp
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:'+(process.env.PORT||8788)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API — app talks to this via the compose network
      - "9001:9001" # web console
    # same creds the app uses — interpolate from .env so there is one source
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  app-data:
  minio-data:
