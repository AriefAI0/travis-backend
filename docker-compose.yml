# Portainer Repository-method deploy target: one-shot schema push + app.
# Postgres and MinIO run as their own containers — create the shared
# network first: docker network create travis
services:
  # one-shot: pushes src/db/schema.ts to the database, then exits.
  # drizzle.config.ts imports src/config/env, so all four vars must parse.
  migrate:
    build:
      context: .
      target: migrate
      network: host # buildkit sandbox must reach apt like the host does
    image: travis-backend:migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    networks:
      - travis
    restart: "no"

  app:
    build:
      context: .
      target: runtime
      network: host # buildkit sandbox must reach apt like the host does
    image: travis-backend:dev
    container_name: travis-backend
    ports:
      - "8788:8788"
    # only the four required vars — the rest default in src/config/env.ts
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      # recording v2 cutover flag (default off; .env controls it)
      RECORDING_V2_ENABLED: ${RECORDING_V2_ENABLED:-false}
    volumes:
      - app-data:/app/data # sqlite tracker + finalize tmp survive redeploys
    networks:
      - travis
    restart: always
    # flow: schema push finishes > app boots with tables in place
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:'+(process.env.PORT||8788)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app-data:

networks:
  travis:
    external: true
