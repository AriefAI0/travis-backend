<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Report</title>

    <!--
      The dialog is the default DOM: it works on its own with no script beyond
      the inline bootstrap. The editor is a progressive enhancement: its module
      loads from esm.sh, and any failure leaves the dialog in place.
    -->
    <link rel="stylesheet" href="https://esm.sh/@docx-editor.dev/core@2.27.0/dist/editor.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:        #f4f4f5;
        --surface:   #ffffff;
        --raised:    #fafafa;
        --border:    #e4e4e7;
        --text:      #18181b;
        --muted:     #71717a;
        --accent:    #18181b;
        --accent-fg: #ffffff;
        --danger:    #b91c1c;
        --success:   #15803d;
        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .dialog {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: 0 4px 24px rgba(0, 0, 0, .12);
        width: 100%;
        max-width: 480px;
        overflow: hidden;
        transition: max-width 160ms;
      }
      /* the editor needs room; the dialog is narrow only while generating */
      .dialog.wide { max-width: 1100px; }

      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      .dialog-header h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
      .dialog-header .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

      .close-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        padding: 4px;
        border-radius: var(--radius-sm);
        line-height: 1;
        font-size: 18px;
      }
      .close-btn:hover { background: var(--bg); color: var(--text); }

      .section { padding: 20px; }
      .section + .section { border-top: 1px solid var(--border); }

      .section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--muted);
        margin-bottom: 12px;
      }

      .state { display: none; }
      .state.active { display: block; }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 18px;
        background: var(--accent);
        color: var(--accent-fg);
        border: none;
        border-radius: var(--radius-md);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        min-height: 40px;
        text-decoration: none;
        transition: opacity 120ms;
      }
      .btn-primary:hover { opacity: .85; }
      .btn-primary:disabled { opacity: .45; cursor: not-allowed; }

      .btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: none;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-size: 13px;
        cursor: pointer;
        color: var(--text);
        min-height: 36px;
        transition: background 120ms;
      }
      .btn-ghost:hover { background: var(--bg); }
      .btn-ghost:disabled { opacity: .45; cursor: not-allowed; }

      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* state: generating */
      .progress-row { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid var(--border);
        border-top-color: var(--text);
        border-radius: 50%;
        animation: spin 700ms linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; border-top-color: var(--accent); }
      }

      /* state: ready */
      .result-box {
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .result-box .filename { font-size: 13px; font-weight: 500; }
      .result-actions { display: flex; flex-wrap: wrap; gap: 8px; }

      .copy-msg {
        font-size: 12px;
        color: var(--success);
        display: none;
      }
      .copy-msg.visible { display: block; }

      /* state: error */
      .error-box {
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: var(--radius-md);
        padding: 12px 14px;
        font-size: 13px;
        color: var(--danger);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .error-box .retry { align-self: flex-start; color: var(--text); }

      /* editor */
      .editor-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .editor-toolbar .status { font-size: 12px; color: var(--muted); margin-left: auto; }
      .editor-host {
        height: min(70vh, 720px);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        overflow: auto;
      }

      /* template section */
      .template-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .template-info { display: flex; flex-direction: column; gap: 2px; }
      .template-name { font-size: 13px; font-weight: 500; }
      .template-meta { font-size: 12px; color: var(--muted); }
      .template-actions { display: flex; gap: 6px; flex-shrink: 0; }

      .upload-msg { font-size: 12px; color: var(--muted); margin-top: 10px; display: none; }
      .upload-msg.visible { display: block; }
      .upload-msg.error { color: var(--danger); }
      .upload-msg.ok { color: var(--success); }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="dialog" role="dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <div>
          <h2 id="dialog-title">Report</h2>
          <p class="meta" id="dialog-meta">Loading project&hellip;</p>
        </div>
        <button class="close-btn" id="close-btn" aria-label="Close">&#x2715;</button>
      </div>

      <!-- Generate: the default surface, and the fallback if the editor fails -->
      <div class="section" id="generate-section">
        <p class="section-label" id="generate-label">Generate</p>
        <div aria-labelledby="generate-label">
          <div class="state active" id="state-idle">
            <button class="btn-primary" id="btn-generate" type="button">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                <path d="M7.5 1v13M1 7.5h13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
              Generate report
            </button>
          </div>

          <div class="state" id="state-generating">
            <div class="progress-row" role="status">
              <div class="spinner" aria-hidden="true"></div>
              <span>Building report &mdash; gathering results and images&hellip;</span>
            </div>
          </div>

          <div class="state" id="state-ready">
            <div class="result-box">
              <div class="filename" id="result-name">report.docx</div>
              <div class="result-actions">
                <a class="btn-primary" id="download-link" download>Download</a>
                <button class="btn-ghost" id="copy-btn" type="button">Copy link</button>
                <button class="btn-ghost" id="regenerate-btn" type="button">Regenerate</button>
              </div>
              <span class="copy-msg" id="copy-msg" role="status">Link copied</span>
            </div>
          </div>

          <div class="state" id="state-error">
            <div class="error-box">
              <strong>Generation failed</strong>
              <span id="error-msg"></span>
              <button class="btn-ghost retry" id="retry-btn" type="button">Try again</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Editor: revealed only when a report can actually be edited -->
      <div class="section" id="editor-section" hidden>
        <p class="section-label">Report</p>
        <div class="editor-toolbar">
          <button class="btn-primary" id="save-btn" data-report-save type="button" disabled>Save</button>
          <button class="btn-ghost" id="editor-regenerate-btn" data-report-regenerate type="button">
            Regenerate
          </button>
          <a class="btn-ghost" id="editor-download-link" data-report-download download>Download</a>
          <span class="status" data-report-status role="status"></span>
        </div>
        <div class="editor-host" data-report-editor></div>
      </div>

      <!-- Template: admin download, edit in Word, upload back -->
      <div class="section">
        <p class="section-label" id="template-label">Template</p>
        <div class="template-row" aria-labelledby="template-label">
          <div class="template-info">
            <span class="template-name">Project template</span>
            <span class="template-meta">Used instead of the built-in layout once uploaded</span>
          </div>
          <div class="template-actions">
            <a class="btn-ghost" id="template-download" download>Download</a>
            <button class="btn-ghost" id="template-replace" type="button">Replace</button>
            <input type="file" id="template-file" accept=".docx" hidden />
          </div>
        </div>
        <p class="upload-msg" id="upload-msg" role="status"></p>
      </div>
    </div>

    <script type="module">
      // The editor comes from esm.sh, so nothing is bundled or built here.
      // This module only defines window.mountReportEditor; the bootstrap below
      // calls it and falls back to the dialog if it never arrived.
      import { createDocxEditor } from "https://esm.sh/@docx-editor.dev/core@2.27.0";

      const DOCX_MIME =
        "application/vnd.openxmlformats-officedocument.wordprocessingml.document";

      const must = (selector) => {
        const found = document.querySelector(selector);
        if (!found) throw new Error(`missing element: ${selector}`);
        return found;
      };

      const readProblem = async (response) => {
        const body = await response.json().catch(() => null);
        return body?.title || `${response.status} ${response.statusText}`;
      };

      let editor = null;

      // Mount the editor over bytes the page already fetched, and wire the toolbar.
      // flow: create editor > wire save/regenerate/download > dirty tracking
      window.mountReportEditor = (bytes, projectId) => {
        const status = must("[data-report-status]");
        const saveButton = must("[data-report-save]");
        const regenerateButton = must("[data-report-regenerate]");
        const downloadLink = must("[data-report-download]");

        editor?.destroy();

        editor = createDocxEditor({
          container: must("[data-report-editor]"),
          document: bytes,
          mode: "edit",
          // no `fonts` config on purpose: layout uses the fixed-width measurer,
          // so the HarfBuzz wasm is never fetched
          onFontError: (error) => console.warn("report editor font error:", error),
        });

        let dirty = false;
        const setDirty = (value) => {
          dirty = value;
          saveButton.disabled = !value;
        };

        editor.on?.("change", () => {
          if (!dirty) setDirty(true);
          status.textContent = "Unsaved changes";
        });

        // closing the tab mid-edit is the one loss no dialog can prevent
        window.addEventListener("beforeunload", (event) => {
          if (dirty) event.preventDefault();
        });

        // save() can reject on a write refusal; keep the editor mounted and say so
        saveButton.addEventListener("click", async () => {
          saveButton.disabled = true;
          status.textContent = "Saving…";
          try {
            const saved = await editor.save();
            const response = await fetch(`/api/v1/projects/${projectId}/report/saved`, {
              method: "PUT",
              headers: { "Content-Type": DOCX_MIME },
              body: new Uint8Array(saved),
            });
            if (!response.ok) throw new Error(await readProblem(response));
            setDirty(false);
            status.textContent = "Saved";
          } catch (error) {
            status.textContent = `Could not save: ${error.message}`;
            saveButton.disabled = false;
          }
        });

        // Regenerate rebuilds from current data and replaces the stored report,
        // so reopening the link shows what this session ended with.
        regenerateButton.addEventListener("click", async () => {
          if (dirty && !confirm("Replace the report with a fresh render? Unsaved changes will be lost.")) {
            return;
          }
          status.textContent = "Rebuilding…";
          try {
            const response = await fetch(`/api/v1/projects/${projectId}/report/docx`);
            if (!response.ok) throw new Error(await readProblem(response));
            const fresh = new Uint8Array(await response.arrayBuffer());

            // store first: the editor should never show something the server lacks
            const stored = await fetch(`/api/v1/projects/${projectId}/report/saved`, {
              method: "PUT",
              headers: { "Content-Type": DOCX_MIME },
              body: fresh,
            });
            if (!stored.ok) throw new Error(await readProblem(stored));

            editor.load(fresh);
            setDirty(false);
            status.textContent = "Regenerated";
          } catch (error) {
            status.textContent = `Could not regenerate: ${error.message}`;
          }
        });

        // Download hands back what is on screen, not a stored copy
        downloadLink.addEventListener("click", async (event) => {
          event.preventDefault();
          const current = await editor.save();
          const url = URL.createObjectURL(new Blob([current], { type: DOCX_MIME }));
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = `report-${projectId}.docx`;
          anchor.click();
          URL.revokeObjectURL(url);
        });

        setDirty(false);
        status.textContent = "";
      };
    </script>

    <script>
      // Classic bootstrap. It drives the dialog and calls the editor module; if
      // that module never loaded, the dialog stays usable on its own.
      const projectId = location.pathname.split("/").filter(Boolean).pop();
      const docxUrl = `/api/v1/projects/${projectId}/report/docx`;
      const savedUrl = `/api/v1/projects/${projectId}/report/saved`;
      const statusUrl = `/api/v1/projects/${projectId}/report/status`;
      const templateUrl = `/api/v1/projects/${projectId}/report/template`;
      const DOCX_MIME =
        "application/vnd.openxmlformats-officedocument.wordprocessingml.document";

      const el = (id) => document.getElementById(id);
      const states = ["idle", "generating", "ready", "error"];
      const show = (name) => {
        for (const state of states) {
          el(`state-${state}`).classList.toggle("active", state === name);
        }
      };

      const dialog = document.querySelector(".dialog");
      const generateSection = el("generate-section");
      const editorSection = el("editor-section");
      const uploadMsg = el("upload-msg");
      const setUploadMsg = (text, kind) => {
        uploadMsg.textContent = text;
        uploadMsg.className = `upload-msg visible${kind ? ` ${kind}` : ""}`;
      };

      el("dialog-meta").textContent = `Project #${projectId}`;
      el("result-name").textContent = `report-${projectId}.docx`;
      el("download-link").download = `report-${projectId}.docx`;
      el("editor-download-link").download = `report-${projectId}.docx`;
      el("template-download").href = templateUrl;
      el("template-download").download = `template-${projectId}.docx`;
      el("close-btn").addEventListener("click", () => window.close());

      // the error responses are problem+json, so the caller-facing text is `title`
      const problem = async (response) => {
        const body = await response.json().catch(() => null);
        return body?.title || `${response.status} ${response.statusText}`;
      };

      // what the page falls back to when the editor cannot start
      window.reportEditorFallback = () => {
        editorSection.hidden = true;
        generateSection.hidden = false;
        dialog.classList.remove("wide");
        show("idle");
      };

      let objectUrl = null;
      const rememberDownload = (bytes) => {
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(new Blob([bytes], { type: DOCX_MIME }));
        el("download-link").href = objectUrl;
      };

      // a generated report and an edited one are the same thing: the stored
      // document. Storing here is what makes the link open the report next time.
      const storeReport = async (bytes) => {
        const response = await fetch(savedUrl, {
          method: "PUT",
          headers: { "Content-Type": DOCX_MIME },
          body: bytes,
        });
        if (!response.ok) throw new Error(await problem(response));
      };

      // flow: reveal the pane > call the module > hand it the bytes
      const openEditor = (bytes) => {
        generateSection.hidden = true;
        editorSection.hidden = false;
        dialog.classList.add("wide");

        if (typeof window.mountReportEditor !== "function") {
          throw new Error("the editor module did not load");
        }
        window.mountReportEditor(bytes, projectId);
      };

      // Downloading the whole report is the only way to surface a failure to
      // the user, so the blob is fetched rather than linked.
      const startGenerate = async () => {
        show("generating");
        el("btn-generate").disabled = true;

        try {
          const response = await fetch(docxUrl);
          if (!response.ok) throw new Error(await problem(response));

          const bytes = new Uint8Array(await response.arrayBuffer());
          rememberDownload(bytes);
          await storeReport(bytes);
          openEditor(bytes);
        } catch (error) {
          console.warn("report editor unavailable, keeping the dialog:", error);
          window.reportEditorFallback();
          el("error-msg").textContent = error.message;
          show("error");
        } finally {
          el("btn-generate").disabled = false;
        }
      };

      el("btn-generate").addEventListener("click", startGenerate);
      el("regenerate-btn").addEventListener("click", startGenerate);
      el("retry-btn").addEventListener("click", startGenerate);

      el("copy-btn").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(location.href);
          el("copy-msg").classList.add("visible");
          setTimeout(() => el("copy-msg").classList.remove("visible"), 2000);
        } catch {
          // a denied clipboard is not worth an error state
        }
      });

      el("template-replace").addEventListener("click", () => el("template-file").click());

      el("template-file").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        el("template-replace").disabled = true;
        setUploadMsg("Uploading template...");

        try {
          const response = await fetch(templateUrl, {
            method: "PUT",
            headers: { "Content-Type": DOCX_MIME },
            body: await file.arrayBuffer(),
          });
          if (!response.ok) throw new Error(await problem(response));
          setUploadMsg("Template replaced. Generate the report again to use it.", "ok");
        } catch (error) {
          setUploadMsg(`Upload failed: ${error.message}`, "error");
        } finally {
          el("template-replace").disabled = false;
          // clearing lets the same file be picked again after a failure
          event.target.value = "";
        }
      });

      // On load: a stored report opens straight in the editor; anything else
      // waits for Generate.
      // flow: status > stored? > open editor : idle
      (async () => {
        try {
          const response = await fetch(statusUrl);
          if (!response.ok) return;

          const body = await response.json();
          if (!body?.data?.saved) return;

          const saved = await fetch(savedUrl);
          if (!saved.ok) return;

          const bytes = new Uint8Array(await saved.arrayBuffer());
          rememberDownload(bytes);
          openEditor(bytes);
        } catch (error) {
          console.warn("report editor unavailable, keeping the dialog:", error);
          window.reportEditorFallback();
        }
      })();
    </script>
  </body>
</html>
