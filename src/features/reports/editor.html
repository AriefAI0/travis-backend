<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report</title>
    <!--
      One report, one page: /editor/reports/{reportId}. Bun serves this file as
      an HTML bundle, so the script below is transpiled and bundled on request
      and needs no build step.

      The editor fills the window and brings its own chrome, toolbar and menu.
      Nothing here styles it.
    -->
    <style>
      /* the editor measures against its container, so the page adds no margin */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./editor-client.tsx"></script>
  </body>
</html>
